name: Angular Build

on:
  push:
    branches:
      - fix/angular22-stabilization
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soft-nutri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: soft-nutri/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
